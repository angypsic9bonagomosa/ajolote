<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🦎 Axolo Explorer 🌊</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0b2230; overflow: hidden; font-family: monospace; user-select: none; }
        canvas { display: block; margin: 0 auto; background-color: #0f2d41; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; touch-action: none; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255, 192, 203, 0.7); border: 2px solid #ff1493; border-radius: 50%; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Ajustar pantalla al tamaño del celular
        canvas.width = window.innerWidth > 800 ? 800 : window.innerWidth;
        canvas.height = window.innerHeight;

        // Dimensiones del Río Gigante
        const MAP_WIDTH = 3000;
        const MAP_HEIGHT = 1200;

        // Estado del juego
        let axolo = { x: canvas.width/2, y: MAP_HEIGHT/2, speed: 5, score: 0 };
        let joystick = { active: false, startX: 0, startY: 0, moveX: 0, moveY: 0, dirX: 0, dirY: 0 };
        let anguloCola = 0;

        // Elementos del Río
        let algas = [], burbujas = [], plantas = [];
        for(let i=0; i<15; i++) algas.push({x: Math.random()*(MAP_WIDTH-200)+100, y: Math.random()*(MAP_HEIGHT-200)+100, size: 15});
        for(let i=0; i<40; i++) burbujas.push({x: Math.random()*MAP_WIDTH, y: Math.random()*MAP_HEIGHT, r: Math.random()*4+2, v: Math.random()*1.5+0.5});
        for(let i=0; i<20; i++) plantas.push({x: Math.random()*MAP_WIDTH, y: Math.random()*200 + (MAP_HEIGHT-250), h: Math.random()*80+60});

        // Controles Táctiles (Joystick)
        const zone = document.getElementById("joystick-zone");
        const knob = document.getElementById("joystick-knob");

        zone.addEventListener("touchstart", (e) => {
            joystick.active = true;
            let t = e.touches[0];
            let bounds = zone.getBoundingClientRect();
            joystick.startX = bounds.left + bounds.width/2;
            joystick.startY = bounds.top + bounds.height/2;
        });

        window.addEventListener("touchmove", (e) => {
            if (!joystick.active) return;
            let t = e.touches[0];
            let dx = t.clientX - joystick.startX;
            let dy = t.clientY - joystick.startY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            let maxDist = 40;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            joystick.dirX = dx / maxDist;
            joystick.dirY = dy / maxDist;
        }, { passive: false });

        window.addEventListener("touchend", () => {
            joystick.active = false;
            knob.style.transform = "translate(0px, 0px)";
            joystick.dirX = 0;
            joystick.dirY = 0;
        });

        // Controles de Teclado (Por si lo abren en PC)
        let keys = {};
        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        function update() {
            let moviendose = false;
            // Movimiento por teclado
            if(keys["ArrowLeft"] || keys["a"]) { axolo.x -= axolo.speed; moviendose = true; }
            if(keys["ArrowRight"] || keys["d"]) { axolo.x += axolo.speed; moviendose = true; }
            if(keys["ArrowUp"] || keys["w"]) { axolo.y -= axolo.speed; moviendose = true; }
            if(keys["ArrowDown"] || keys["s"]) { axolo.y += axolo.speed; moviendose = true; }

            // Movimiento por Joystick táctil
            if(joystick.active) {
                axolo.x += joystick.dirX * axolo.speed;
                axolo.y += joystick.dirY * axolo.speed;
                moviendose = true;
            }

            // Límites del mapa
            if(axolo.x < 30) axolo.x = 30; if(axolo.x > MAP_WIDTH-30) axolo.x = MAP_WIDTH-30;
            if(axolo.y < 30) axolo.y = 30; if(axolo.y > MAP_HEIGHT-30) axolo.y = MAP_HEIGHT-30;

            anguloCola += moviendose ? 0.2 : 0.05;

            // Animación de burbujas
            burbujas.forEach(b => { b.y -= b.v; if(b.y < 0) { b.y = MAP_HEIGHT; b.x = Math.random()*MAP_WIDTH; } });

            // Colisiones con Algas
            algas.forEach((alga, idx) => {
                let dist = Math.sqrt((axolo.x - alga.x)**2 + (axolo.y - alga.y)**2);
                if(dist < 40) {
                    axolo.score++;
                    algas[idx] = {x: Math.random()*(MAP_WIDTH-200)+100, y: Math.random()*(MAP_HEIGHT-200)+100, size: 15};
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Calcular Cámara
            let camX = axolo.x - canvas.width / 2;
            let camY = axolo.y - canvas.height / 2;
            if(camX < 0) camX = 0; if(camX > MAP_WIDTH - canvas.width) camX = MAP_WIDTH - canvas.width;
            if(camY < 0) camY = 0; if(camY > MAP_HEIGHT - canvas.height) camY = MAP_HEIGHT - canvas.height;

            // 1. Plantas de fondo
            plantas.forEach(p => {
                ctx.strokeStyle = "#2e6e3c"; ctx.lineWidth = 8;
                ctx.beginPath(); ctx.moveTo(p.x - camX, p.y - camY);
                ctx.lineTo(p.x + 10 - camX, p.y - p.h - camY); ctx.stroke();
            });

            // 2. Burbujas
            ctx.strokeStyle = "rgba(30, 85, 110, 0.5)"; ctx.lineWidth = 1;
            burbujas.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x - camX, b.y - camY, b.r, 0, Math.PI*2); ctx.stroke();
            });

            // 3. Algas
            ctx.fillStyle = "#228b22";
            algas.forEach(alga => {
                ctx.beginPath(); ctx.arc(alga.x - camX, alga.y - camY, alga.size, 0, Math.PI*2); ctx.fill();
            });

            // 4. DIBUJAR AJOLOTE (AXOLO)
            let sx = axolo.x - camX; let sy = axolo.y - camY;
            let offsetCola = Math.sin(anguloCola) * 12;

            // Cola
            ctx.fillStyle = "#ffc0cb"; ctx.beginPath();
            ctx.moveTo(sx, sy + 15); ctx.lineTo(sx + offsetCola*0.5, sy + 35);
            ctx.lineTo(sx + offsetCola, sy + 55); ctx.lineTo(sx, sy + 15); ctx.fill();
            ctx.fillStyle = "#ff1493"; ctx.beginPath(); ctx.arc(sx + offsetCola, sy + 55, 6, 0, Math.PI*2); ctx.fill();

            // Branquias
            ctx.fillStyle = "#ff1493";
            [-18, -8, 2, 12].forEach(i => {
                ctx.beginPath(); ctx.arc(sx - 22, sy - 10 + i, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(sx + 22, sy - 10 + i, 5, 0, Math.PI*2); ctx.fill();
            });

            // Cuerpo y Cabeza
            ctx.fillStyle = "#ffc0cb";
            ctx.beginPath(); ctx.ellipse(sx, sy, 18, 22, 0, 0, Math.PI*2); ctx.fill(); // Cuerpo
            ctx.beginPath(); ctx.arc(sx, sy - 12, 20, 0, Math.PI*2); ctx.fill(); // Cabeza

            // Ojos y Sonrisa
            ctx.fillStyle = "#000";
            ctx.beginPath(); ctx.arc(sx - 8, sy - 14, 3, 0, Math.PI*2); ctx.beginPath(); ctx.arc(sx + 8, sy - 14, 3, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "#643232"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy - 10, 5, 0, Math.PI); ctx.stroke();

            // UI Marcador Fijo
            ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(10, 10, 240, 45);
            ctx.fillStyle = "#fff"; ctx.font = "16px monospace";
            ctx.fillText(`🌱 ALGAS: ${axolo.score}`, 25, 38);
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
