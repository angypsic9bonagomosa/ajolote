<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🦎 Axolo Explorer: Xochimilco Extremo 🌊</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0b2230; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; }
        canvas { display: block; margin: 0 auto; background-color: #0f2d41; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; touch-action: none; z-index: 10; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255, 192, 203, 0.8); border: 2px solid #ff1493; border-radius: 50%; }
        .pantalla-final { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 25, 40, 0.96); color: #fff; text-align: center; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        .btn { padding: 15px 30px; font-size: 20px; font-weight: bold; margin: 15px; border-radius: 8px; border: none; cursor: pointer; font-family: monospace; }
        .btn-reiniciar { background-color: #ff1493; color: white; }
        .btn-salir { background-color: #555; color: white; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    
    <div id="pantallaFinal" class="pantalla-final">
        <h1 id="tituloFinal" style="font-size: 40px; color: #ff3333;">¡FIN DEL JUEGO!</h1>
        <p id="motivoFinal" style="font-size: 22px;"></p>
        <h2 id="puntosFinal" style="font-size: 35px; color: #ffd700;">Puntos Totales: 0</h2>
        <div>
            <button class="btn btn-reiniciar" onclick="reiniciarJuego()">EMPEZAR DE NUEVO</button>
            <button class="btn btn-salir" onclick="salirJuego()">SALIR</button>
        </div>
    </div>
<script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth > 900 ? 900 : window.innerWidth;
        canvas.height = window.innerHeight;

        const MAP_WIDTH = 6000;
        const MAP_HEIGHT = 2000;

        let axolo, joystick, algas, burbujas, plantas, piedras, depredadores;
        let score, tiempoRestante, juegoActivo, anguloCola, intervaloTiempo;

        joystick = { active: false, startX: 0, startY: 0, dirX: 0, dirY: 0 };
        const zone = document.getElementById("joystick-zone");
        const knob = document.getElementById("joystick-knob");

        zone.addEventListener("touchstart", (e) => {
            joystick.active = true;
            let bounds = zone.getBoundingClientRect();
            joystick.startX = bounds.left + bounds.width/2;
            joystick.startY = bounds.top + bounds.height/2;
        });

        window.addEventListener("touchmove", (e) => {
            if (!joystick.active) return;
            let t = e.touches;
            let dx = t.clientX - joystick.startX;
            let dy = t.clientY - joystick.startY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            let maxDist = 40;

            if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            joystick.dirX = dx / maxDist; joystick.dirY = dy / maxDist;
        });

        window.addEventListener("touchend", () => {
            joystick.active = false;
            knob.style.transform = "translate(0px, 0px)";
            joystick.dirX = 0; joystick.dirY = 0;
        });

        let keys = {};
        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        function crearDepredador(tipo) {
            let x = Math.random() > 0.5 ? -200 : MAP_WIDTH + 200;
            let y = Math.random() * (MAP_HEIGHT - 300) + 100;
            let vx = (Math.random() * 3 + 4) * (x < 0 ? 1 : -1);
            
            if (tipo === "garza") {
                return { x: Math.random() * MAP_WIDTH, y: -100, vx: (Math.random() * 2 - 1) * 2, vy: 6, radius: 35, tipo: "garza", color: "#f5f5f5", colorAleta: "#e0e0e0" };
            } else if (tipo === "bagre") {
                return { x: x, y: y, vx: vx * 1.3, vy: 0, radius: 38, tipo: "bagre", color: "#424242", colorAleta: "#212121" };
            } else {
                return { x: x, y: y, vx: vx, vy: 0, radius: 45, tipo: "carpa", color: "#d35400", colorAleta: "#a04000" };
            }
        }

        function inicializarObjetos() {
            axolo = { x: canvas.width/2, y: MAP_HEIGHT/2, speed: 7.5, radius: 24 };
            score = 0;
            tiempoRestante = 180;
            juegoActivo = true;
            anguloCola = 0;
            
            depredadores = [crearDepredador("carpa"), crearDepredador("bagre")];

            algas = [];
            for(let i=0; i<65; i++) {
                algas.push({
                    x: Math.random()*(MAP_WIDTH-300)+150, 
                    y: Math.random()*(MAP_HEIGHT-300)+150, 
                    tipo: Math.random() > 0.65 ? "dorada" : "comun"
                });
            }

            burbujas = []; for(let i=0; i<100; i++) burbujas.push({x: Math.random()*MAP_WIDTH, y: Math.random()*MAP_HEIGHT, r: Math.random()*4+2, v: Math.random()*1.5+0.5});
            plantas = []; for(let i=0; i<1200; i++) plantas.push({x: Math.random()*MAP_WIDTH, y: Math.random()*800 + (MAP_HEIGHT-850), h: Math.random()*150+60, tono: Math.random() > 0.5 ? "#1b4d22" : "#2e7d32"});
            piedras = []; for(let i=0; i<150; i++) piedras.push({x: Math.random()*MAP_WIDTH, y: (MAP_HEIGHT - 30) - Math.random()*120, r: Math.random()*20+10});
        }

        function contarTiempo() {
            if (!juegoActivo) return;
            tiempoRestante--;
            
            if (tiempoRestante % 15 === 0 && tiempoRestante > 0) {
                let tipos = ["carpa", "bagre", "garza"];
                let nuevoTipo = tipos[Math.floor(Math.random() * tipos.length)];
                depredadores.push(crearDepredador(nuevoTipo));
                
                depredadores.forEach(d => {
                    d.vx *= 1.15;
                    if(d.vy !== 0) d.vy *= 1.15;
                });
            }

            if (tiempoRestante <= 0) {
                finalizarJuego("¡HÉROE DE XOCHIMILCO!", "¡Axolo resistió la oleada extrema y salvó el río!");
            }
        }

        function finalizarJuego(titulo, motivo) {
            juegoActivo = false;
            clearInterval(intervaloTiempo);
            document.getElementById("tituloFinal").innerText = titulo;
            document.getElementById("motivoFinal").innerText = motivo;
            document.getElementById("puntosFinal").innerText = `Puntos Totales: ${score}`;
            document.getElementById("pantallaFinal").style.display = "flex";
        }

        function reiniciarJuego() {
            document.getElementById("pantallaFinal").style.display = "none";
            inicializarObjetos();
            clearInterval(intervaloTiempo);
            intervaloTiempo = setInterval(contarTiempo, 1000);
        }

        function salirJuego() {
            window.location.href = "https://google.com";
        }
function update() {
            if (!juegoActivo) return;

            let moviendose = false;
            if(keys["ArrowLeft"] || keys["a"]) { axolo.x -= axolo.speed; moviendose = true; }
            if(keys["ArrowRight"] || keys["d"]) { axolo.x += axolo.speed; moviendose = true; }
            if(keys["ArrowUp"] || keys["w"]) { axolo.y -= axolo.speed; moviendose = true; }
            if(keys["ArrowDown"] || keys["s"]) { axolo.y += axolo.speed; moviendose = true; }

            if(joystick.active) {
                axolo.x += joystick.dirX * axolo.speed;
                axolo.y += joystick.dirY * axolo.speed;
                moviendose = true;
            }

            if(axolo.x < 30) axolo.x = 30; if(axolo.x > MAP_WIDTH-30) axolo.x = MAP_WIDTH-30;
            if(axolo.y < 30) axolo.y = 30; if(axolo.y > MAP_HEIGHT-40) axolo.y = MAP_HEIGHT-40;

            anguloCola += moviendose ? 0.25 : 0.04;

            burbujas.forEach(b => { b.y -= b.v; if(b.y < 0) { b.y = MAP_HEIGHT; b.x = Math.random()*MAP_WIDTH; } });

            depredadores.forEach(d => {
                if (d.tipo === "garza") {
                    d.y += d.vy;
                    d.x += d.vx;
                    if (d.y > MAP_HEIGHT + 100) {
                        d.y = -100;
                        d.x = Math.random() * MAP_WIDTH;
                        d.vy = 6 + (180 - tiempoRestante) * 0.05;
                    }
                } else {
                    d.x += d.vx;
                    d.y += Math.sin(d.x * 0.015) * 2.5;
                    if ((d.vx > 0 && d.x > MAP_WIDTH + 200) || (d.vx < 0 && d.x < -200)) {
                        d.x = d.vx > 0 ? -200 : MAP_WIDTH + 200;
                        d.y = Math.random() * (MAP_HEIGHT - 300) + 100;
                    }
                }

                let distEnemigo = Math.sqrt((axolo.x - d.x)**2 + (axolo.y - d.y)**2);
                if (distEnemigo < (axolo.radius + d.radius - 12)) {
                    let nombreEnemigo = d.tipo === "garza" ? "una Garza Blanca" : d.tipo === "bagre" ? "un Bagre de lodo" : "un pez Carpa";
                    finalizarJuego("💀 ¡AXOLO FUE DESTRUIDO!", `Te atrapó ${nombreEnemigo} en la zona de peligro.`);
                }
            });

            algas.forEach((alga, idx) => {
                let dist = Math.sqrt((axolo.x - alga.x)**2 + (axolo.y - alga.y)**2);
                if(dist < (axolo.radius + 15)) {
                    score += alga.tipo === "dorada" ? 5 : 1;
                    algas[idx] = {
                        x: Math.random()*(MAP_WIDTH-300)+150, 
                        y: Math.random()*(MAP_HEIGHT-300)+150, 
                        tipo: Math.random() > 0.65 ? "dorada" : "comun"
                    };
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let camX = axolo.x - canvas.width / 2;
            let camY = axolo.y - canvas.height / 2;
            if(camX < 0) camX = 0; if(camX > MAP_WIDTH - canvas.width) camX = MAP_WIDTH - canvas.width;
            if(camY < 0) camY = 0; if(camY > MAP_HEIGHT - canvas.height) camY = MAP_HEIGHT - canvas.height;

            ctx.fillStyle = "#0a2232"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#160f0a"; ctx.fillRect(0 - camX, MAP_HEIGHT - 160 - camY, MAP_WIDTH, 180);
            ctx.fillStyle = "#261c14"; ctx.fillRect(0 - camX, MAP_HEIGHT - 80 - camY, MAP_WIDTH, 90);

            piedras.forEach(p => {
                ctx.fillStyle = p.r > 20 ? "#3e4246" : "#51565a";
                ctx.beginPath(); ctx.arc(p.x - camX, p.y - camY, p.r, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "#1c1e20"; ctx.lineWidth = 2; ctx.stroke();
            });

            plantas.forEach(p => {
                let rx = p.x - camX; let ry = p.y - camY;
                if (rx >= -50 && rx <= canvas.width + 50) {
                    ctx.strokeStyle = p.tono; ctx.lineWidth = 8; ctx.lineCap = "round";
                    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + 10, ry - p.h); ctx.stroke();
                    ctx.fillStyle = p.tono === "#1b4d22" ? "#226335" : "#3c914e";
                    ctx.beginPath(); ctx.arc(rx + 10, ry - p.h, 12, 0, Math.PI*2); ctx.fill();
                }
            });

            ctx.strokeStyle = "rgba(40, 115, 145, 0.35)"; ctx.lineWidth = 1.5;
            burbujas.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x - camX, b.y - camY, b.r, 0, Math.PI*2); ctx.stroke();
            });

            algas.forEach(alga => {
                ctx.fillStyle = alga.tipo === "dorada" ? "#ffd700" : "#2e7d32";
                ctx.beginPath(); ctx.arc(alga.x - camX, alga.y - camY, alga.tipo === "dorada" ? 18 : 13, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = alga.tipo === "dorada" ? "#ffffff" : "#a1dfb1";
                ctx.beginPath(); ctx.arc(alga.x - camX + 2, alga.y - camY - 2, 4, 0, Math.PI*2); ctx.fill();
            });

            depredadores.forEach(d => {
                let cx = d.x - camX; let cy = d.y - camY;
                ctx.fillStyle = d.color; ctx.beginPath();
                
                if (d.tipo === "garza") {
                    ctx.ellipse(cx, cy, d.radius*0.6, d.radius, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#ffb300"; ctx.beginPath();
                    ctx.moveTo(cx, cy + d.radius); ctx.lineTo(cx - 8, cy + d.radius + 35); ctx.lineTo(cx + 8, cy + d.radius + 35); ctx.fill();
                } else {
                    ctx.ellipse(cx, cy, d.radius, d.radius*0.58, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = d.colorAleta; ctx.beginPath();
                    ctx.moveTo(cx - d.radius, cy); ctx.lineTo(cx - d.radius - 24, cy - 18); ctx.lineTo(cx - d.radius - 24, cy + 18); ctx.fill();
                    if(d.tipo === "bagre") {
                        ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.moveTo(cx + 25, cy + 5); ctx.lineTo(cx + 45, cy + 15); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(cx + 25, cy - 5); ctx.lineTo(cx + 45, cy - 15); ctx.stroke();
                    }
                }
            });

            let sx = axolo.x - camX; let sy = axolo.y - camY;
            let offsetCola = Math.sin(anguloCola) * 14;

            ctx.strokeStyle = "#ffb6c1"; ctx.lineWidth = 6; ctx.lineCap = "round";
            ctx.beginPath(); ctx.moveTo(sx - 12, sy + 10); ctx.lineTo(sx - 26, sy + 28); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(sx + 12, sy + 10); ctx.lineTo(sx + 26, sy + 28); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(sx - 15, sy - 8); ctx.lineTo(sx - 28, sy - 4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(sx + 15, sy - 8); ctx.lineTo(sx + 28, sy - 4); ctx.stroke();

            ctx.fillStyle = "#ffb6c1"; ctx.beginPath();
            ctx.moveTo(sx, sy + 15); ctx.lineTo(sx + offsetCola*0.5, sy + 40);
            ctx.lineTo(sx + offsetCola, sy + 65); ctx.lineTo(sx, sy + 15); ctx.fill();
            ctx.fillStyle = "#ff1493"; ctx.beginPath(); ctx.arc(sx + offsetCola, sy + 65, 8, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = "#ff1493";
            [-18, -8, 2, 12].forEach(i => {
                ctx.beginPath(); ctx.arc(sx - 24, sy - 12 + i, 5.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(sx + 24, sy - 12 + i, 5.5, 0, Math.PI*2); ctx.fill();
            });

            ctx.fillStyle = "#ffb6c1"; ctx.beginPath(); ctx.ellipse(sx, sy, 20, 25, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(sx, sy - 14, 23, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = "#000000";
            ctx.beginPath(); ctx.arc(sx - 9, sy - 14, 4.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(sx + 9, sy - 14, 4.5, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = "#ffffff";
            ctx.beginPath(); ctx.arc(sx - 8, sy - 15, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(sx + 10, sy - 15, 1.5, 0, Math.PI*2); ctx.fill();

            ctx.strokeStyle = "#7b3f00"; ctx.lineWidth = 2.5; ctx.beginPath();
            ctx.arc(sx, sy - 11, 6, 0, Math.PI); ctx.stroke();

            ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(15, 15, 360, 85);
            ctx.fillStyle = "#fff"; ctx.font = "bold 16px monospace";
            
            let mins = Math.floor(tiempoRestante / 60); let segs = tiempoRestante % 60;
            ctx.fillText(`🌱 SCORE DE RÍO: ${score}`, 30, 42);
            ctx.fillText(`⏱️ TIEMPO: ${mins}:${segs < 10 ? '0' : ''}${segs}`, 30, 68);

            if (depredadores.length >= 5) {
                ctx.fillStyle = "#ff3333"; ctx.font = "bold 12px monospace";
                ctx.fillText("⚠️ ¡PELIGRO: HORDA EXTREMA DETECTADA!", 30, 90);
            }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

        inicializarObjetos();
        intervaloTiempo = setInterval(contarTiempo, 1000);
        gameLoop();
    </script>
</body>
</html>
